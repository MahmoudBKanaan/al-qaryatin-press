name: Deploy Qaryatain.com

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_type == 'branch' && !github.event.deleted
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Choose Pages branch
        id: target
        shell: node {0}
        run: |
          const { createHash } = require('node:crypto');
          const { appendFileSync } = require('node:fs');
          const ref = process.env.GITHUB_REF;
          const branch = ref === 'refs/heads/main'
            ? 'main'
            : 'preview-' + createHash('sha256').update(ref).digest('hex').slice(0, 32);
          appendFileSync(process.env.GITHUB_OUTPUT, 'branch=' + branch + '\n');
      - name: Build and test for Qaryatain.com
        env:
          CF_PAGES: '1'
        run: npm test
      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: 816ab737b2bbd85c4b1ab206d4967bc4
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=al-qaryatin-press --branch=${{ steps.target.outputs.branch }} --commit-hash=${{ github.sha }}
      - name: Show site URL
        env:
          SITE_URL: ${{ steps.target.outputs.branch == 'main' && 'https://qaryatain.com/' || steps.pages.outputs.pages-deployment-alias-url || steps.pages.outputs.deployment-url }}
        run: printf '[Open deployment](%s)\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
